name: pdf_viewer_example
description: "Demonstrates how to use the pdf_viewer plugin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  pdf_viewer:
    path: ../
  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6

dev_dependencies:
  analysis_lints: ^1.1.1
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sample.pdf
